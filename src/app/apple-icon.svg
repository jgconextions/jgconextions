<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="180" height="180" rx="40" fill="url(#grad1)"/>
  
  <!-- Icono de computadora/tecnología estilizado (escalado) -->
  <g transform="translate(40, 40)">
    <!-- Monitor/Pantalla -->
    <rect x="10" y="20" width="60" height="40" rx="5" fill="#0a1a2e" opacity="0.9"/>
    <rect x="15" y="25" width="50" height="30" rx="2.5" fill="#4a9eff"/>
    
    <!-- Base del monitor -->
    <rect x="30" y="60" width="20" height="10" rx="2.5" fill="#0a1a2e" opacity="0.9"/>
    <rect x="25" y="70" width="30" height="5" rx="2.5" fill="#0a1a2e" opacity="0.7"/>
    
    <!-- Señal/conexión (representando "Conextions") -->
    <circle cx="70" cy="30" r="7.5" fill="#60a5fa"/>
    <circle cx="82.5" cy="35" r="5" fill="#60a5fa" opacity="0.8"/>
    <circle cx="92.5" cy="42.5" r="4" fill="#60a5fa" opacity="0.6"/>
  </g>
</svg>

